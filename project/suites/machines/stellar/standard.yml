# Machine-specific config for Princeton Stellar cluster.
# Merge into a suite YAML by passing this file as the second arg to
# generate_slurm.py:
#   python generate_slurm.py suite.yml project/suites/machine.stellar.yml
#
# NOTE: mail_user is a placeholder — edit before submitting.

slurm:
  queue: null                        # Stellar default queue (leave null to use the default)
  nodes: 4
  ntasks: 384                        # 96 tasks/node × 4 nodes for R8_8pc
  tasks_per_node: 96
  time: "47:30:00"
  srun_time: "47:00:00"
  mail_user: changgoo@princeton.edu
  mail_type: ALL
  auto_resubmit: true

athena:
  dir: $HOME/Athena-TIGRESS-NCR
  executable: tigress_ncr
  sb99base: Z014_GenevaV00
  modules: |
    module purge
    module load anaconda3/2020.11; module load intel/2021.1.2 intel-mpi/intel/2021.1.1 hdf5/intel-2021.1/intel-mpi/1.10.6 fftw/intel-2021.1/3.3.9

suite:
  run_base: /scratch/gpfs/changgoo/TIGRESS-PHANGS
